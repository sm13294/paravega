<!doctype html>
<html>
<head><meta charset="utf-8"><title>ParaVega browser tests</title></head>
<body>
<script>
  // Vega 6 by default; ?vega=5 loads Vega 5.33 and Vega-Lite 5.23 (installed as vega5 / vega-lite5).
  window.PW_VEGA5 = new URLSearchParams(location.search).get("vega") === "5";
  document.write('<script src="/node_modules/' + (PW_VEGA5 ? "vega5" : "vega") + '/build/vega.min.js"><\/script>');
</script>
<script>
  document.write('<script src="/node_modules/' + (PW_VEGA5 ? "vega-lite5" : "vega-lite") + '/build/vega-lite.min.js"><\/script>');
</script>
<script>
  // Print the stack of errors logged by a test (the console of the driver shows only messages).
  const err = console.error.bind(console);
  console.error = (...a) => err(...a.map(x => (x instanceof Error ? x.stack || String(x) : x)));
</script>
<script type="module">
  // Loads one bundle of test/browser/build.mjs; the driver reads the console and __pwExit.
  const test = new URLSearchParams(location.search).get("test");
  import(`/dist/browser-tests/${test}.js`).catch(e => { console.error(String(e && e.stack || e)); window.__pwExit = 1; });
</script>
</body>
</html>
