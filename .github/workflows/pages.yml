# Builds the showcase (showcase/site/) and deploys it to GitHub Pages.
# GitHub Pages cannot send the cross-origin isolation headers; the page's
# service worker (showcase/src/coi-sw.js) adds them on the first visit.
name: showcase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node showcase/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
